# Local infrastructure for development. Run `docker compose up -d` once Docker
# is installed, then set in apps/api/.env:
#   DATABASE_URL=postgresql://entrix:entrix@localhost:5432/entrix
#   REDIS_URL=redis://localhost:6379
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: entrix
      POSTGRES_PASSWORD: entrix
      POSTGRES_DB: entrix
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U entrix']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
